<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parisian Fragments — lueur.studio</title>

  <script src="data.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f1ee;
      --ink: #2b2d42;
      --ink2: #3a3c52;
      --muted: #8d99ae;
      --blue: #4a5a7a;
      --blue-mid: #6b7a9a;
      --border: rgba(43,45,66,.1);
      --serif: "Cormorant Garamond", "Noto Serif TC", serif;
      --mono: "Inter", sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      line-height: 2;
    }

    nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 6vw;
      border-bottom: 1px solid var(--border);
      background: rgba(242,241,238,.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      color: var(--ink);
      font-family: var(--mono);
      font-size: .85rem;
      font-style: italic;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .logo span { color: var(--blue); }

    .nav-r {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-r a,
    .nav-r span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 100px 2.5rem 3rem;
      border-right: 1px solid var(--border);
      background: var(--bg);
    }

    .side-group h3 {
      margin-bottom: 1.2rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .side-list {
      list-style: none;
    }

    .side-list li {
      margin-bottom: .8rem;
    }

    .side-list a {
      color: var(--ink2);
      font-family: var(--serif);
      font-size: .95rem;
      font-style: italic;
      text-decoration: none;
    }

    .side-list a:hover,
    .side-list a.is-active {
      padding-left: 5px;
      color: var(--blue);
    }

    .side-list a.is-active::before {
      content: "— ";
    }

    main {
      flex-grow: 1;
      min-width: 0;
      padding: 7rem 8% 5rem;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 3rem;
      color: var(--ink);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .16em;
      text-decoration: none;
    }

    .back-home:hover { opacity: .55; }

    .page-label {
      display: block;
      margin-bottom: 1rem;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 4rem;
      color: var(--ink2);
      font-size: clamp(2.5rem, 5vw, 4.4rem);
      font-style: italic;
      font-weight: 300;
      line-height: 1.1;
    }

    h1 span {
      color: var(--muted);
      font-size: .55em;
      font-style: normal;
    }

    .journal-list {
      max-width: 1180px;
    }

    .journal-item {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr) 220px;
      gap: 3rem;
      align-items: center;
      padding: 2.5rem 0;
      border-top: 1px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: opacity .25s ease;
    }

    .journal-item:last-child {
      border-bottom: 1px solid var(--border);
    }

    .journal-item:hover { opacity: .68; }

    .j-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 1.5rem;
      border-right: 1px solid var(--border);
    }

    .j-cat {
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .j-date {
      color: var(--muted);
      font-family: "Noto Serif TC", serif;
      font-size: .75rem;
      font-style: italic;
    }

    .j-content h2 {
      margin-bottom: .4rem;
      color: var(--ink2);
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .j-content p {
      color: var(--ink2);
      font-family: "Noto Serif TC", serif;
      font-size: .9rem;
      line-height: 2;
    }

    .j-thumb {
      width: 220px;
      aspect-ratio: 3 / 2;
      border-radius: 2px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: grayscale(90%);
      transition: .5s ease;
    }

    .journal-item:hover .j-thumb {
      filter: grayscale(0%);
      transform: translateY(-5px);
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2rem;
      align-items: end;
      padding: 2rem 8% 3rem;
      border-top: 1px solid var(--border);
    }

    footer a,
    footer p {
      margin: 0;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    footer a {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0;
      text-transform: none;
    }

    footer p:nth-child(2) { text-align: center; }
    footer p:last-child { text-align: right; opacity: .5; }

    @media (min-width: 1024px) {
      .main-wrapper { flex-direction: row; }

      .sidebar {
        position: sticky;
        top: 0;
        width: 280px;
        height: 100vh;
        flex-shrink: 0;
      }
    }

    @media (max-width: 768px) {
      .nav-r { gap: .8rem; }

      main { padding: 5rem 1.5rem 4rem; }

      .journal-item {
        display: flex;
        flex-direction: column-reverse;
        gap: 1.2rem;
        align-items: flex-start;
      }

      .j-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      .j-meta {
        flex-direction: row;
        justify-content: space-between;
        width: 100%;
        padding: 0 0 .5rem;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      footer {
        display: flex;
        flex-direction: column;
        gap: .8rem;
        align-items: flex-start;
        padding: 2rem 1.5rem 2.5rem;
      }

      footer p:nth-child(2),
      footer p:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html"><span>l</span>ueur.studio</a>

    <div class="nav-r">
      <a href="index.html#recent">日常</a>
      <a href="index.html#about">關於</a>
      <span>Paris, FR</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="side-group">
        <h3>探索 · Explore</h3>

        <ul class="side-list">
          <li><a class="is-active" href="journal.html">Parisian Fragments</a></li>
          <li><a href="index.html#gallery">Visual Diary</a></li>
          <li><a href="index.html#about">About Me</a></li>
          <li><a href="comments.html">Leave a Note</a></li>
        </ul>
      </div>
    </aside>

    <main>
      <a class="back-home" href="index.html">← BACK TO HOME</a>

      <span class="page-label">巴黎碎片 · PARISIAN FRAGMENTS</span>

      <h1>Chroniques <span>/ Fragments</span></h1>

      <div class="journal-list" id="journalList"></div>
    </main>
  </div>

  <footer>
    <a href="index.html">lueur.studio</a>
    <p>48° 51' 24" N / 2° 21' 08" E</p>
    <p>© 2026 lueur.studio</p>
  </footer>

  <script>
    function renderJournal() {
      const container = document.getElementById("journalList");

      if (typeof POSTS === "undefined") {
        container.innerHTML = "<p>文章資料暫時無法載入。</p>";
        return;
      }

      container.innerHTML = [...POSTS].reverse().map(post => {
        const image = post.img.startsWith("http") || post.img.startsWith("images/")
          ? post.img
          : "images/" + post.img;

        return `
          <a class="journal-item" href="article.html?id=${encodeURIComponent(post.id)}">
            <div class="j-meta">
              <span class="j-cat">${post.cat}</span>
              <span class="j-date">${post.date}</span>
            </div>

            <div class="j-content">
              <h2>${post.title}</h2>
              <p>${post.excerpt || ""}</p>
            </div>

            <div class="j-thumb" style="background-image:url('${image}')"></div>
          </a>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", renderJournal);
  </script>
</body>
</html>
