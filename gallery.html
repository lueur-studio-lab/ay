<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Diary — lueur.studio</title>

  <script src="data.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f1ee;
      --ink: #2b2d42;
      --ink2: #3a3c52;
      --muted: #8d99ae;
      --blue: #4a5a7a;
      --blue-mid: #6b7a9a;
      --border: rgba(43,45,66,.1);
      --serif: "Cormorant Garamond", "Noto Serif TC", serif;
      --mono: "Inter", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      line-height: 2;
    }

    nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 6vw;
      border-bottom: 1px solid var(--border);
      background: rgba(242,241,238,.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      color: var(--ink);
      font-family: var(--mono);
      font-size: .85rem;
      font-style: italic;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .logo span { color: var(--blue); }

    .nav-r {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-r a,
    .nav-r span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 100px 2.5rem 3rem;
      border-right: 1px solid var(--border);
    }

    .side-group h3 {
      margin-bottom: 1.2rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .side-list { list-style: none; }
    .side-list li { margin-bottom: .8rem; }

    .side-list a {
      color: var(--ink2);
      font-family: var(--serif);
      font-size: .95rem;
      font-style: italic;
      text-decoration: none;
    }

    .side-list a:hover,
    .side-list a.is-active {
      padding-left: 5px;
      color: var(--blue);
    }

    .side-list a.is-active::before {
      content: "— ";
    }

    main {
      flex-grow: 1;
      min-width: 0;
      padding: 7rem 8% 6rem;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 3rem;
      color: #34312c;
      font-family: var(--serif);
      font-size: .7rem;
      letter-spacing: .16em;
      text-decoration: none;
    }

    .back-home:hover { opacity: .55; }

    .page-label {
      display: block;
      margin-bottom: 1rem;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 1rem;
      color: var(--ink2);
      font-size: clamp(2.5rem, 5vw, 4.4rem);
      font-style: italic;
      font-weight: 300;
      line-height: 1.1;
    }

    .intro {
      max-width: 440px;
      margin-bottom: 4rem;
      color: var(--ink2);
      font-family: "Noto Serif TC", serif;
      font-size: .9rem;
      line-height: 2;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 980px;
    }

    .album-card {
      position: relative;
      display: block;
      min-height: 440px;
      overflow: hidden;
      color: white;
      text-decoration: none;
      background: var(--ink);
    }

    .album-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(35%);
      transition: transform .7s ease, filter .7s ease;
    }

    .album-card:hover img {
      filter: grayscale(0%);
      transform: scale(1.05);
    }

    .album-card::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(transparent 35%, rgba(0,0,0,.68));
    }

    .album-card__text {
      position: absolute;
      z-index: 1;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 2rem;
    }

    .album-card__count {
      display: block;
      margin-bottom: .5rem;
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .18em;
      opacity: .8;
      text-transform: uppercase;
    }

    .album-card__title {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1.15;
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2rem;
      align-items: end;
      padding: 2rem 8% 3rem;
      border-top: 1px solid var(--border);
    }

    footer a,
    footer p {
      margin: 0;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    footer a {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0;
      text-transform: none;
    }

    footer p:nth-child(2) { text-align: center; }
    footer p:last-child { text-align: right; opacity: .5; }

    @media (min-width: 1024px) {
      .main-wrapper { flex-direction: row; }

      .sidebar {
        position: sticky;
        top: 0;
        width: 280px;
        height: 100vh;
        flex-shrink: 0;
      }
    }

    @media (max-width: 768px) {
      .nav-r { gap: .8rem; }

      main { padding: 5rem 1.5rem 4rem; }

      .album-grid {
        grid-template-columns: 1fr;
      }

      .album-card {
        min-height: 480px;
      }

      footer {
        display: flex;
        flex-direction: column;
        gap: .8rem;
        align-items: flex-start;
        padding: 2rem 1.5rem 2.5rem;
      }

      footer p:nth-child(2),
      footer p:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html"><span>l</span>ueur.studio</a>

    <div class="nav-r">
      <a href="journal.html">日常</a>
      <a href="about.html">關於</a>
      <span>Paris, FR</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="side-group">
        <h3>探索 · Explore</h3>

        <ul class="side-list">
          <li><a href="journal.html">Parisian Fragments</a></li>
          <li><a class="is-active" href="gallery.html">Visual Diary</a></li>
          <li><a href="comments.html">Leave a Note</a></li>
          <li><a href="about.html">About Me</a></li>
        </ul>
      </div>
    </aside>

    <main>
      <a class="back-home" href="index.html">← BACK TO HOME</a>

      <span class="page-label">影像紀錄 · VISUAL DIARY</span>
      <h1>Between <span style="font-size:.55em;color:var(--muted);font-style:normal;">/ Frames</span></h1>

      <p class="intro">
        介於光線、建築與步伐之間。這裡收集那些無需太多解釋的巴黎片刻。
      </p>

      <div class="album-grid" id="albumGrid"></div>
    </main>
  </div>

  <footer>
    <a href="index.html">lueur.studio</a>
    <p>48° 51' 24" N / 2° 21' 08" E</p>
    <p>© 2026 lueur.studio</p>
  </footer>

  <script>
    function imagePath(image) {
      return image.startsWith("http") || image.startsWith("images/")
        ? image
        : "images/" + image;
    }

    function renderAlbums() {
      const grid = document.getElementById("albumGrid");

      if (typeof ALBUMS === "undefined") {
        grid.innerHTML = "<p>相簿資料暫時無法載入。</p>";
        return;
      }

      grid.innerHTML = ALBUMS.map(album => {
        const count = Array.isArray(album.photos) ? album.photos.length : 0;

        return `
          <a class="album-card" href="album.html?id=${encodeURIComponent(album.id)}">
            <img src="${imagePath(album.cover)}" alt="${album.title}">
            <div class="album-card__text">
              <span class="album-card__count">${count} photographs</span>
              <div class="album-card__title">${album.title}</div>
            </div>
          </a>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", renderAlbums);
  </script>
</body>
</html>
