<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album — lueur.studio</title>

  <script src="data.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f1ee;
      --ink: #2b2d42;
      --ink2: #3a3c52;
      --muted: #8d99ae;
      --blue: #4a5a7a;
      --blue-mid: #6b7a9a;
      --border: rgba(43,45,66,.1);
      --serif: "Cormorant Garamond", "Noto Serif TC", serif;
      --mono: "Inter", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      line-height: 2;
    }

    nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 6vw;
      border-bottom: 1px solid var(--border);
      background: rgba(242,241,238,.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      color: var(--ink);
      font-family: var(--mono);
      font-size: .85rem;
      font-style: italic;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .logo span { color: var(--blue); }

    .nav-r {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-r a,
    .nav-r span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 100px 2.5rem 3rem;
      border-right: 1px solid var(--border);
    }

    .side-group h3 {
      margin-bottom: 1.2rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .side-list { list-style: none; }
    .side-list li { margin-bottom: .8rem; }

    .side-list a {
      color: var(--ink2);
      font-family: var(--serif);
      font-size: .95rem;
      font-style: italic;
      text-decoration: none;
    }

    .side-list a:hover,
    .side-list a.is-active {
      padding-left: 5px;
      color: var(--blue);
    }

    .side-list a.is-active::before {
      content: "— ";
    }

    main {
      flex-grow: 1;
      min-width: 0;
      padding: 7rem 8% 6rem;
    }

    .album-page {
      max-width: 1100px;
      margin: 0 auto;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 3rem;
      color: #34312c;
      font-family: var(--serif);
      font-size: .7rem;
      letter-spacing: .16em;
      text-decoration: none;
    }

    .back-home:hover { opacity: .55; }

    .page-label {
      display: block;
      margin-bottom: 1rem;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: .8rem;
      color: var(--ink2);
      font-size: clamp(2.5rem, 5vw, 4.4rem);
      font-style: italic;
      font-weight: 300;
      line-height: 1.1;
    }

    .album-count {
      margin-bottom: 3rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .photo-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: min(70vh, 760px);
      border: 1px solid var(--border);
      background: #e8e6e0;
    }

    .photo-stage img {
      display: block;
      max-width: 100%;
      max-height: min(70vh, 760px);
      object-fit: contain;
    }

    .photo-button {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(242,241,238,.92);
      color: var(--ink);
      cursor: pointer;
      font-size: 2rem;
      line-height: 1;
      transform: translateY(-50%);
      transition: background .2s ease, color .2s ease;
    }

    .photo-button:hover {
      background: var(--ink);
      color: var(--bg);
    }

    .photo-button:disabled {
      display: none;
    }

    .photo-button.prev { left: 1.25rem; }
    .photo-button.next { right: 1.25rem; }

    .photo-caption {
      min-height: 3rem;
      margin-top: 1rem;
      color: var(--ink2);
      font-family: "Noto Serif TC", serif;
      font-size: .92rem;
      font-style: italic;
      text-align: center;
    }

    .photo-index {
      margin-top: .4rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }

    .all-albums {
      display: inline-block;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--blue);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .14em;
      text-decoration: none;
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2rem;
      align-items: end;
      padding: 2rem 8% 3rem;
      border-top: 1px solid var(--border);
    }

    footer a,
    footer p {
      margin: 0;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    footer a {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0;
      text-transform: none;
    }

    footer p:nth-child(2) { text-align: center; }
    footer p:last-child { text-align: right; opacity: .5; }

    @media (min-width: 1024px) {
      .main-wrapper { flex-direction: row; }

      .sidebar {
        position: sticky;
        top: 0;
        width: 280px;
        height: 100vh;
        flex-shrink: 0;
      }
    }

    @media (max-width: 768px) {
      .nav-r { gap: .8rem; }

      main { padding: 5rem 1.5rem 4rem; }

      .photo-stage {
        min-height: 55vh;
      }

      .photo-button {
        width: 42px;
        height: 42px;
      }

      .photo-button.prev { left: .75rem; }
      .photo-button.next { right: .75rem; }

      footer {
        display: flex;
        flex-direction: column;
        gap: .8rem;
        align-items: flex-start;
        padding: 2rem 1.5rem 2.5rem;
      }

      footer p:nth-child(2),
      footer p:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html"><span>l</span>ueur.studio</a>

    <div class="nav-r">
      <a href="journal.html">日常</a>
      <a href="about.html">關於</a>
      <span>Paris, FR</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="side-group">
        <h3>探索 · Explore</h3>

        <ul class="side-list">
          <li><a href="journal.html">Parisian Fragments</a></li>
          <li><a class="is-active" href="gallery.html">Visual Diary</a></li>
          <li><a href="comments.html">Leave a Note</a></li>
          <li><a href="about.html">About Me</a></li>
        </ul>
      </div>
    </aside>

    <main>
      <section class="album-page" id="albumPage"></section>
    </main>
  </div>

  <footer>
    <a href="index.html">lueur.studio</a>
    <p>48° 51' 24" N / 2° 21' 08" E</p>
    <p>© 2026 lueur.studio</p>
  </footer>

  <script>
    let currentAlbum;
    let currentIndex = 0;

    function imagePath(image) {
      return image.startsWith("http") || image.startsWith("images/")
        ? image
        : "images/" + image;
    }

    function showPhoto(index) {
      currentIndex = index;
      const photo = currentAlbum.photos[currentIndex];
      const total = currentAlbum.photos.length;

      document.getElementById("albumPhoto").src = imagePath(photo.img);
      document.getElementById("albumPhoto").alt = photo.desc || currentAlbum.title;
      document.getElementById("photoCaption").textContent = photo.desc || "";
      document.getElementById("photoIndex").textContent = `${currentIndex + 1} / ${total}`;

      document.getElementById("prevPhoto").disabled = total <= 1;
      document.getElementById("nextPhoto").disabled = total <= 1;
    }

    function renderAlbum() {
      const container = document.getElementById("albumPage");
      const id = new URLSearchParams(window.location.search).get("id");

      if (typeof ALBUMS === "undefined" || !id) {
        container.innerHTML = `
          <a class="back-home" href="index.html">← BACK TO HOME</a>
          <h1>找不到這本相簿</h1>
          <a class="all-albums" href="gallery.html">VIEW ALL ALBUMS →</a>
        `;
        return;
      }

      currentAlbum = ALBUMS.find(album => album.id === id);

      if (!currentAlbum || !Array.isArray(currentAlbum.photos) || !currentAlbum.photos.length) {
        container.innerHTML = `
          <a class="back-home" href="index.html">← BACK TO HOME</a>
          <h1>找不到這本相簿</h1>
          <a class="all-albums" href="gallery.html">VIEW ALL ALBUMS →</a>
        `;
        return;
      }

      document.title = `${currentAlbum.title} — lueur.studio`;

      container.innerHTML = `
        <a class="back-home" href="index.html">← BACK TO HOME</a>

        <span class="page-label">影像紀錄 · VISUAL DIARY</span>
        <h1>${currentAlbum.title}</h1>
        <p class="album-count">${currentAlbum.photos.length} photographs</p>

        <div class="photo-stage">
          <button id="prevPhoto" class="photo-button prev" type="button" aria-label="上一張照片">‹</button>
          <img id="albumPhoto" src="" alt="">
          <button id="nextPhoto" class="photo-button next" type="button" aria-label="下一張照片">›</button>
        </div>

        <p class="photo-caption" id="photoCaption"></p>
        <p class="photo-index" id="photoIndex"></p>

        <a class="all-albums" href="gallery.html">VIEW ALL ALBUMS →</a>
      `;

      document.getElementById("prevPhoto").addEventListener("click", () => {
        const previous = currentIndex === 0
          ? currentAlbum.photos.length - 1
          : currentIndex - 1;

        showPhoto(previous);
      });

      document.getElementById("nextPhoto").addEventListener("click", () => {
        const next = currentIndex === currentAlbum.photos.length - 1
          ? 0
          : currentIndex + 1;

        showPhoto(next);
      });

      document.addEventListener("keydown", event => {
        if (event.key === "ArrowLeft") {
          document.getElementById("prevPhoto").click();
        }

        if (event.key === "ArrowRight") {
          document.getElementById("nextPhoto").click();
        }
      });

      showPhoto(0);
    }

    document.addEventListener("DOMContentLoaded", renderAlbum);
  </script>
</body>
</html>
