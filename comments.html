  display: flex;

<main>
  <section class="sec" id="comments">
    <a class="back-home" href="index.html">← BACK TO HOME</a>

    <div class="comments-heading">
      <div>
        <p class="sec-label">留言 · LEAVE A NOTE</p>
        <h1>寫一封小信給我</h1>
      </div>

      <p>For small thoughts, lingering moments,<br>and notes sent from afar.</p>
    </div>

    <form
      id="comment-form"
      action="YOUR_APPS_SCRIPT_URL"
      method="post"
      target="comment-result"
      class="note-form"
    >
      <div class="note-form__inner">
        <label for="comment-name">YOUR NAME</label>
        <input
          id="comment-name"
          name="name"
          type="text"
          placeholder="怎麼稱呼你？"
          required
        >

        <label for="comment-message">YOUR NOTE</label>
        <textarea
          id="comment-message"
          name="message"
          rows="6"
          placeholder="留下想說的話⋯⋯"
          required
        ></textarea>

        <input
          name="website"
          type="text"
          tabindex="-1"
          autocomplete="off"
          style="position:absolute;left:-9999px;"
          aria-hidden="true"
        >

        <div class="note-form__footer">
          <span>FROM PARIS, WITH LOVE</span>
          <button type="submit">SEND NOTE <i>→</i></button>
        </div>
      </div>

      <p id="comment-status" aria-live="polite"></p>
    </form>

    <iframe name="comment-result" style="display:none;"></iframe>
  </section>
  <footer class="site-footer">
  <a href="index.html">lueur.studio</a>
  <p>48° 51' 24" N / 2° 21' 08" E</p>
  <p>© 2026 LUEUR.STUDIO</p>
</footer>
</main>

<script>
  const form = document.getElementById('comment-form');
  const status = document.getElementById('comment-status');

  form.addEventListener('submit', () => {
    status.textContent = '謝謝你的留言。';
    status.style.display = 'block';
    form.reset();
  });
</script>
