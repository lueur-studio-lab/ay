<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 這是建置模板：tools/build.py 會用它產生 posts/ 底下每一篇文章。版面要改就改這裡。 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">

{{HEAD}}

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f1ee;
      --ink: #2b2d42;
      --ink2: #3a3c52;
      --muted: #8d99ae;
      --blue: #4a5a7a;
      --blue-mid: #6b7a9a;
      --border: rgba(43,45,66,.1);
      --serif: "Cormorant Garamond", "Noto Serif TC", serif;
      --mono: "Inter", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      line-height: 2;
    }

    nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 6vw;
      border-bottom: 1px solid var(--border);
      background: rgba(242,241,238,.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      color: var(--ink);
      font-family: var(--mono);
      font-size: .85rem;
      font-style: italic;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .logo span { color: var(--blue); }

    .nav-r {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-r a,
    .nav-r span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 100px 2.5rem 3rem;
      border-right: 1px solid var(--border);
    }

    .side-group h3 {
      margin-bottom: 1.2rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
      color: var(--blue-mid);
      font-family: var(--serif);
      font-size: .95rem;
      font-style: italic;
      font-weight: 300;
      letter-spacing: 0;
      text-transform: none;
    }

    .side-list { list-style: none; }
    .side-list li { margin-bottom: .8rem; }

    .side-list a {
      color: var(--ink2);
      font-family: var(--serif);
      font-size: .95rem;
      font-style: italic;
      text-decoration: none;
    }

    .side-list a:hover,
    .side-list a.is-active {
      padding-left: 5px;
      color: var(--blue);
    }

    .side-list a.is-active::before {
      content: "— ";
    }

    main {
      flex-grow: 1;
      min-width: 0;
      padding: 7rem 8% 6rem;
    }

    .article {
      max-width: 800px;
      margin: 0 auto;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 3rem;
      color: #34312c;
      font-family: var(--serif);
      font-size: .7rem;
      font-style: normal;
      letter-spacing: .16em;
      text-decoration: none;
    }

    .back-home:hover { opacity: .55; }

    .article-category {
      display: block;
      margin-bottom: 1rem;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: .8rem;
      color: var(--ink2);
      font-size: clamp(2.3rem, 4vw, 4rem);
      font-weight: 400;
      line-height: 1.25;
    }

    .article-date {
      margin-bottom: 3rem;
      color: var(--muted);
      font-family: "Noto Serif TC", serif;
      font-size: .8rem;
      font-style: italic;
    }

    .article-cover {
      position: relative;
      margin: 0 0 3rem;
    }

    .article-cover img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: cover;
    }

    .watermark {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      color: rgba(255,255,255,.8);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .12em;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }

    .article-body {
      color: var(--ink2);
      font-family: "Noto Serif TC", serif;
      font-size: .98rem;
      line-height: 2.2;
    }

    .article-body p,
    .article-body div {
      margin-bottom: 2rem;
    }

    .article-body img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 2.5rem auto;
    }

    .article-body figure {
      margin: 2.5rem auto;
    }

    .article-body figcaption {
      margin-top: .5rem;
      color: var(--muted);
      font-size: .75rem;
      text-align: right;
    }

    /* ── 留言區 ── */
    .comment-section {
      max-width: 560px;
      margin-top: 5rem;
      padding-top: 3rem;
      border-top: 1px solid var(--border);
    }

    .comment-label {
      display: block;
      margin-bottom: .5rem;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .comment-intro {
      margin-bottom: 2rem;
      color: var(--muted);
      font-family: "Noto Serif TC", serif;
      font-size: .9rem;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: .6rem 0;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-family: "Noto Serif TC", serif;
      font-size: .95rem;
      font-weight: 300;
      outline: none;
      transition: border-color .3s;
    }

    .comment-form textarea {
      resize: none;
      line-height: 1.8;
    }

    .comment-form input::placeholder,
    .comment-form textarea::placeholder {
      color: var(--muted);
      opacity: .7;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-bottom-color: var(--blue);
    }

    .comment-form button {
      align-self: flex-start;
      padding: .7rem 2.2rem;
      border: none;
      background: var(--blue);
      color: var(--bg);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .25s;
    }

    .comment-form button:hover { background: var(--blue-mid); }
    .comment-form button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .comment-form button:disabled { opacity: .5; cursor: default; }

    .comment-ok,
    .comment-error {
      display: none;
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: .9rem;
    }

    .comment-ok {
      padding: 1rem 1.5rem;
      border-left: 2px solid var(--blue);
      color: var(--ink2);
      font-style: italic;
    }

    .comment-error { color: #a05050; }

    .all-articles {
      display: inline-block;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--blue);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .14em;
      text-decoration: none;
    }

    /* ── 下一篇 ── */
    .read-next {
      display: block;
      margin-top: 4rem;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: opacity .25s ease;
    }

    .read-next:hover { opacity: .65; }
    .read-next:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }

    .read-next-label {
      display: block;
      margin-bottom: .6rem;
      color: #34312c;
      font-family: var(--serif);
      font-size: .7rem;
      font-style: normal;
      letter-spacing: .16em;
    }

    .read-next-title {
      display: block;
      color: var(--ink2);
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.6;
    }

    /* ── 回到頂部箭頭 ── */
    .to-top {
      position: fixed;
      right: 30px;
      bottom: 30px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg);
      color: var(--blue-mid);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, color .2s ease;
    }

    .to-top.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .to-top:hover { color: var(--ink); }
    .to-top:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2rem;
      align-items: end;
      padding: 2rem 8% 3rem;
      border-top: 1px solid var(--border);
    }

    footer a,
    footer p {
      margin: 0;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    footer a {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0;
      text-transform: none;
    }

    footer p:nth-child(2) { text-align: center; }
    footer p:last-child { text-align: right; opacity: .5; }

    @media (min-width: 1024px) {
      .main-wrapper { flex-direction: row; }

      .sidebar {
        position: sticky;
        top: 0;
        width: 280px;
        height: 100vh;
        flex-shrink: 0;
      }
    }

    @media (max-width: 768px) {
      .nav-r { gap: .8rem; }

      main { padding: 5rem 1.5rem 4rem; }

      .to-top { right: 20px; bottom: 20px; }

      .article-body {
        font-size: .94rem;
        line-height: 2.1;
      }

      footer {
        display: flex;
        flex-direction: column;
        gap: .8rem;
        align-items: flex-start;
        padding: 2rem 1.5rem 2.5rem;
      }

      footer p:nth-child(2),
      footer p:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html"><span>l</span>ueur.studio</a>

    <div class="nav-r">
      <span>Paris, FR</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="side-group">
        <h3>探索 · Explore</h3>

        <ul class="side-list">
          <li><a class="is-active" href="journal.html">Parisian Fragments</a></li>
          <li><a href="gallery.html">Visual Diary</a></li>
          <li><a href="comments.html">Leave a Note</a></li>
          <li><a href="about.html">About Me</a></li>
        </ul>
      </div>
    </aside>

    <main>
      <article class="article" id="article">
{{ARTICLE}}
      </article>
    </main>
  </div>

  <footer>
    <a href="index.html">lueur.studio</a>
    <p>48° 51' 24" N / 2° 21' 08" E</p>
    <p>© 2026 lueur.studio</p>
  </footer>

  <button type="button" class="to-top" id="toTop" aria-label="回到頂部">↑</button>

  <script>
    // Google 表單設定：留言會存進你的 Google 試算表
    const FORM_URL      = "https://docs.google.com/forms/d/e/1FAIpQLSdxMO7JvuMLH4gJhOq0XfegeMHNNml34gbVgt1zp7Bspgsd8w/formResponse";
    const ENTRY_NAME    = "entry.450055053";
    const ENTRY_MESSAGE = "entry.1563429280";
    const ENTRY_EMAIL   = "entry.1796219169";

    const currentTitle = {{POST_TITLE_JSON}};

    function submitComment(event) {
      event.preventDefault();

      const form = event.target;
      const messageEl = document.getElementById("commentMessage");
      const message = messageEl.value.trim();
      const button = form.querySelector("button");
      const ok = document.getElementById("commentOk");
      const error = document.getElementById("commentError");

      if (!message) {
        messageEl.focus();
        return;
      }

      ok.style.display = "none";
      error.style.display = "none";
      button.disabled = true;

      const body = new URLSearchParams();
      body.append(ENTRY_NAME, document.getElementById("commentName").value.trim());
      // 留言前面自動加上文章標題，在試算表裡就知道是哪一篇
      body.append(ENTRY_MESSAGE, `【${currentTitle}】\n${message}`);
      body.append(ENTRY_EMAIL, document.getElementById("commentEmail").value.trim());

      fetch(FORM_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString()
      })
        .then(() => {
          form.reset();
          ok.style.display = "block";
        })
        .catch(() => {
          error.style.display = "block";
        })
        .finally(() => {
          button.disabled = false;
        });
    }

    // 回到頂部箭頭：往下滑超過 400px 才出現
    const toTop = document.getElementById("toTop");

    window.addEventListener("scroll", () => {
      toTop.classList.toggle("is-visible", window.scrollY > 400);
    }, { passive: true });

    toTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

  </script>
</body>
</html>
