        /* 引用 Google Fonts：Noto Serif TC (宋體) & Playfair Display (義大利斜體) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Playfair+Display:ital,wght@1,400;1,500&display=swap');

        body { 
            margin: 0; 
            background: #F0F2F5; /* 更柔和的冷灰背景 */
            color: #2b2d42; 
            font-family: "Noto Serif TC", serif; 
            line-height: 2; 
            -webkit-font-smoothing: antialiased; /* 讓字體更清晰 */
        }

        .container { max-width: 900px; margin: 0 auto; padding: 0 40px; }

        /* 頂部導航 */
        nav { 
            padding: 40px 0; 
            display: flex; 
            justify-content: space-between; 
            letter-spacing: 3px; 
            font-size: 0.75rem; 
            border-bottom: 1px solid #d1d5db;
            margin-bottom: 80px;
        }

        /* 標題區域 */
        header { text-align: center; margin-bottom: 100px; }
        h1 { font-size: 3rem; font-weight: 300; letter-spacing: 5px; color: #1a1a1a; margin: 0 0 10px 0; }
        .subtitle { font-family: 'Playfair Display', serif; color: #8d99ae; font-style: italic; font-size: 1.1rem; letter-spacing: 1px; }

        /* 文章卡片 */
        .post-card { 
            background: #fff; /* 讓文章區塊浮現，像一張白紙 */
            padding: 80px 60px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.03); /* 柔和的陰影 */
            margin-bottom: 100px;
            position: relative;
        }

        /* 日期樣式 */
        .date { 
            font-size: 0.75rem; 
            color: #adb5bd; 
            letter-spacing: 2px; 
            display: block; 
            margin-bottom: 25px; 
        }

            margin-bottom: 50px; 
            font-weight: 500; 
            line-height: 1.4;
            color: #1a1a1a;
        }
