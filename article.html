<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 — lueur.studio</title>

  <script src="data.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f1ee;
      --ink: #2b2d42;
      --ink2: #3a3c52;
      --muted: #8d99ae;
      --blue: #4a5a7a;
      --blue-mid: #6b7a9a;
      --border: rgba(43,45,66,.1);
      --serif: "Cormorant Garamond", "Noto Serif TC", serif;
      --mono: "Inter", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      line-height: 2;
    }

    nav {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 6vw;
      border-bottom: 1px solid var(--border);
      background: rgba(242,241,238,.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      color: var(--ink);
      font-family: var(--mono);
      font-size: .85rem;
      font-style: italic;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .logo span { color: var(--blue); }

    .nav-r {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-r a,
    .nav-r span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      padding: 100px 2.5rem 3rem;
      border-right: 1px solid var(--border);
    }

    .side-group h3 {
      margin-bottom: 1.2rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .side-list { list-style: none; }
    .side-list li { margin-bottom: .8rem; }

    .side-list a {
      color: var(--ink2);
      font-family: var(--serif);
      font-size: .95rem;
      font-style: italic;
      text-decoration: none;
    }

    .side-list a:hover,
    .side-list a.is-active {
      padding-left: 5px;
      color: var(--blue);
    }

    .side-list a.is-active::before {
      content: "— ";
    }

    main {
      flex-grow: 1;
      min-width: 0;
      padding: 7rem 8% 6rem;
    }

    .article {
      max-width: 800px;
      margin: 0 auto;
    }

    .back-home {
  display: inline-block;
  margin-bottom: 3rem;
  color: #34312c;
  font-family: var(--serif);
  font-size: .7rem;
  font-style: normal;
  letter-spacing: .16em;
  text-decoration: none;
}

    .back-home:hover { opacity: .55; }

    .article-category {
      display: block;
      margin-bottom: 1rem;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: .8rem;
      color: var(--ink2);
      font-size: clamp(2.3rem, 4vw, 4rem);
      font-weight: 400;
      line-height: 1.25;
    }

    .article-date {
      margin-bottom: 3rem;
      color: var(--muted);
      font-family: "Noto Serif TC", serif;
      font-size: .8rem;
      font-style: italic;
    }

    .article-cover {
      position: relative;
      margin: 0 0 3rem;
    }

    .article-cover img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: cover;
    }

    .watermark {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      color: rgba(255,255,255,.8);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .12em;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }

    .article-body {
      color: var(--ink2);
      font-family: "Noto Serif TC", serif;
      font-size: .98rem;
      line-height: 2.2;
    }

    .article-body p,
    .article-body div {
      margin-bottom: 2rem;
    }

    .article-body img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 2.5rem auto;
    }

    .article-body figure {
      margin: 2.5rem auto;
    }

    .article-body figcaption {
      margin-top: .5rem;
      color: var(--muted);
      font-size: .75rem;
      text-align: right;
    }

    .all-articles {
      display: inline-block;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--blue);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .14em;
      text-decoration: none;
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2rem;
      align-items: end;
      padding: 2rem 8% 3rem;
      border-top: 1px solid var(--border);
    }

    footer a,
    footer p {
      margin: 0;
      color: var(--blue-mid);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    footer a {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0;
      text-transform: none;
    }

    footer p:nth-child(2) { text-align: center; }
    footer p:last-child { text-align: right; opacity: .5; }

    @media (min-width: 1024px) {
      .main-wrapper { flex-direction: row; }

      .sidebar {
        position: sticky;
        top: 0;
        width: 280px;
        height: 100vh;
        flex-shrink: 0;
      }
    }

    @media (max-width: 768px) {
      .nav-r { gap: .8rem; }

      main { padding: 5rem 1.5rem 4rem; }

      .article-body {
        font-size: .94rem;
        line-height: 2.1;
      }

      footer {
        display: flex;
        flex-direction: column;
        gap: .8rem;
        align-items: flex-start;
        padding: 2rem 1.5rem 2.5rem;
      }

      footer p:nth-child(2),
      footer p:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html"><span>l</span>ueur.studio</a>

    <div class="nav-r">
      <a href="journal.html">日常</a>
      <a href="index.html#about">關於</a>
      <span>Paris, FR</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <aside class="sidebar">
      <div class="side-group">
        <h3>探索 · Explore</h3>

        <ul class="side-list">
          <li><a class="is-active" href="journal.html">Parisian Fragments</a></li>
          <li><a href="index.html#gallery">Visual Diary</a></li>
          <li><a href="comments.html">Leave a Note</a></li>
          <li><a href="index.html#about">About Me</a></li>
        </ul>
      </div>
    </aside>

    <main>
      <article class="article" id="article"></article>
    </main>
  </div>

  <footer>
    <a href="index.html">lueur.studio</a>
    <p>48° 51' 24" N / 2° 21' 08" E</p>
    <p>© 2026 lueur.studio</p>
  </footer>

  <script>
    function imagePath(image) {
      return image.startsWith("http") || image.startsWith("images/")
        ? image
        : "images/" + image;
    }

    function renderArticle() {
      const container = document.getElementById("article");
      const id = new URLSearchParams(window.location.search).get("id");

      if (typeof POSTS === "undefined" || !id) {
        container.innerHTML = `
          <a class="back-home" href="index.html">← BACK TO HOME</a>
          <h1>找不到這篇文章</h1>
          <a class="all-articles" href="journal.html">VIEW ALL ARTICLES →</a>
        `;
        return;
      }

      const post = POSTS.find(item => item.id === id);

      if (!post) {
        container.innerHTML = `
          <a class="back-home" href="index.html">← BACK TO HOME</a>
          <h1>找不到這篇文章</h1>
          <a class="all-articles" href="journal.html">VIEW ALL ARTICLES →</a>
        `;
        return;
      }

      document.title = `${post.title} — lueur.studio`;

      container.innerHTML = `
        <a class="back-home" href="index.html">← BACK TO HOME</a>

        <span class="article-category">${post.cat}</span>
        <h1>${post.title}</h1>
        <p class="article-date">— PUBLISHED ON ${post.date}</p>

        <figure class="article-cover">
          <img src="${imagePath(post.img)}" alt="${post.title}">
          <span class="watermark">© lueur.studio</span>
        </figure>

        <div class="article-body">${post.content}</div>

        <a class="all-articles" href="journal.html">VIEW ALL ARTICLES →</a>
      `;
    }

    document.addEventListener("DOMContentLoaded", renderArticle);
  </script>
</body>
</html>
